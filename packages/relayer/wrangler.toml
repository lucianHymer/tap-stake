name = "eip7702-relayer"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Environment variables - set these with wrangler secret
# RPC_URL - The RPC endpoint URL
# CHAIN_ID - The chain ID (e.g. 11155420 for OP Sepolia)
# ALLOWED_CONTRACT_ADDRESS - The StakerWallet contract address to allow for delegated execution
# APPROVED_CHOICE_IDS - Comma-separated list of approved choice IDs
# TOKEN_ADDRESS - The ERC20 token being staked (e.g., GTC)
# STAKE_CHOICES_ADDRESS - The StakeChoicesERC6909 contract address
# MINIMUM_HOLDINGS - Minimum total holdings required in wei (e.g., 90e18 = 90 tokens)


# Secrets - set these with wrangler secret
# PRIVATE_KEY - The relayer's private key

vars = { ENVIRONMENT = "production", CHAIN_ID = "10", RPC_URL = "https://mainnet.optimism.io", ALLOWED_CONTRACT_ADDRESS = "0xAA2B1999C772cF2B4E5478e4b5C54aE8447ef756", APPROVED_CHOICE_IDS = "99921030434853126453340568019546123113290951926625281747676119336391366179676,103467882007752256716465905423493267637639752828754828952501832282292424221652,37022085098767960322629082668856854414683424180269164484809959024879061362464,102590855234691522285546861392190170000582855349844279089213381909182907084793,113654052384035540339254108331114608443394203971279322386708763587320017623119,26590924299719391955823896655943307388838177793986195267126087681677919884365", TOKEN_ADDRESS = "0x1eba7a6a72c894026cd654ac5cdcf83a46445b08", STAKE_CHOICES_ADDRESS = "0x67f18cDa427b2BB5128A5C33a7D70F13C6FFeed4", MINIMUM_HOLDINGS = "90000000000000000000" }
workers_dev = false

route = { pattern = "stake-worker.lucianhymer.com", custom_domain = true }

